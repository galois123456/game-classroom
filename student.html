<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>학생 참가 · 수학 게임 교실</title><link rel="stylesheet" href="css/common.css"></head><body><main class="wrap"><header class="top"><a class="brand" href="index.html">▦ 수학 게임 교실</a><span class="pill">학생 전용</span></header><section class="narrow"><p class="eyebrow">JOIN THE CLASSROOM</p><h1>함께 게임할 준비됐나요?</h1><p class="muted">회원가입 없이 참가합니다. 같은 교사의 게임에서는 같은 학번·이름·개인 비밀번호를 사용하세요.</p><section class="card"><form id="joinForm"><label>방 코드<input id="room" required maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="예: A12B34CD"></label><div class="row"><label>학번<input id="num" required maxlength="24" autocomplete="off" placeholder="예: 10101" pattern="[A-Za-z0-9_\-]{1,24}"></label><label>이름<input id="studentName" required maxlength="40" autocomplete="name"></label></div><label>개인 비밀번호<input id="spw" type="password" required minlength="4" maxlength="72" autocomplete="off" placeholder="새 비밀번호 6자 이상 · 기존 4자 비밀번호 사용 가능"></label><label>방 비밀번호<input id="rpw" type="password" required maxlength="72" autocomplete="off" placeholder="선생님이 알려 준 비밀번호"></label><p class="muted small">학번·이름·게임 기록은 이 방을 만든 교사에게 제공됩니다. 다른 서비스의 비밀번호는 사용하지 마세요.</p><button id="join">참가하기 →</button></form><p id="msg" class="message" role="status" aria-live="polite"></p><a id="resume" class="button secondary hidden" href="games/streams-student.html">진행 중인 게임으로 돌아가기</a></section></section><footer>수학 게임 교실 ver1.03 · made by yoonsungho</footer></main>
