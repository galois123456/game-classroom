<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>수학 게임 방 · 수학 게임 교실</title><link rel="stylesheet" href="../css/common.css"></head><body><main class="wrap">
<header class="top"><a class="brand" href="../index.html">▦ 수학 게임 교실</a><a class="button secondary compact" href="../index.html">게임 선택</a></header>
<p class="eyebrow" id="eyebrow">CLASSROOM GAME</p><h1 id="title">게임 방</h1><p id="intro" class="muted"></p><p id="msg" class="message" role="status" aria-live="polite"></p>
<section class="card"><h2>새 게임 방</h2><form id="createForm" class="stack">
<label>방 비밀번호<input id="roomPassword" type="password" required minlength="4" maxlength="72" autocomplete="new-password" placeholder="학생에게 따로 알려 주세요"></label>
<div class="row game-settings baseball-settings"><label>숫자 자리수<select id="digitLength"><option>3</option><option selected>4</option><option>5</option></select></label><label>최대 추측 라운드<input id="maxRounds" type="number" value="9" min="1" max="50"></label></div>
<label class="check-row baseball-settings"><input id="allowZero" type="checkbox" checked> 0 사용 허용</label>
<div class="class-settings hidden"><label>정답 숫자<input id="answerNumber" inputmode="numeric" placeholder="예: 427" autocomplete="off"></label><p class="small muted">중복 숫자 없이 설정합니다. 정답은 학생에게 보이지 않습니다.</p></div>
<div class="arithmetic-settings hidden"><fieldset><legend>출제할 연산</legend><div class="row"><label class="check-row"><input type="checkbox" name="op" value="add" checked> 덧셈</label><label class="check-row"><input type="checkbox" name="op" value="sub" checked> 뺄셈</label><label class="check-row"><input type="checkbox" name="op" value="mul" checked> 곱셈</label><label class="check-row"><input type="checkbox" name="op" value="div" checked> 나눗셈</label><label class="check-row"><input type="checkbox" name="op" value="square"> 제곱</label><label class="check-row"><input type="checkbox" name="op" value="sqrt"> 제곱근</label><label class="check-row"><input type="checkbox" name="op" value="cube"> 세제곱</label><label class="check-row"><input type="checkbox" name="op" value="fourth"> 네제곱</label><label class="check-row"><input type="checkbox" name="op" value="mixed"> 복합 문제</label></div></fieldset>
<div class="row"><label>덧셈 자릿수<select id="digitAdd"><option value="auto">자동</option><option>1</option><option>2</option><option>3</option></select></label><label>뺄셈 자릿수<select id="digitSub"><option value="auto">자동</option><option>1</option><option>2</option><option>3</option></select></label></div>
<div class="row"><label>곱셈 자릿수<select id="digitMul"><option value="auto">자동</option><option>1</option><option>2</option><option>3</option></select></label><label>나눗셈 자릿수<select id="digitDiv"><option value="auto">자동</option><option>1</option><option>2</option><option>3</option></select></label></div>
<div class="row"><label>정답 문제 수<input id="totalQuestions" type="number" min="1" max="500" value="100"></label><label>오답 처리<select id="wrongMode"><option value="gameover">틀리면 게임 종료</option><option value="reset_zero">맞힌 수와 점수 초기화</option><option value="minus1">맞힌 수 1개 감소</option><option value="minus2">맞힌 수 2개 감소</option><option value="continue">감점 후 계속</option></select></label></div><p class="small muted">레벨은 정답 5개마다 상승합니다. 정답 점수는 레벨×10점이며 완주 시 남은 시간 보너스를 더합니다. 복합 문제는 레벨 10부터 일부 출제되고, 제한 시간은 60분입니다.</p></div>
<button id="create">방 만들기</button></form></section>
<section class="card"><div class="top"><h2>내 게임방</h2><button id="refreshRooms" class="secondary compact">새로 고침</button></div><div id="roomList" class="room-list"></div></section>
<section id="roomPanel" class="hidden"><div class="host-layout"><section class="card"><p class="eyebrow">학생 참가 링크</p><h2>방 코드 <span id="roomCode" class="room-code"></span></h2><div id="qr" class="qr" aria-label="학생 참가 QR"></div><p id="roomInfo" class="small muted"></p><input id="joinUrl" readonly aria-label="학생 참가 링크"><div class="row"><button id="copy" type="button" class="secondary">링크 복사</button><button id="openJoin" type="button" class="secondary">참가 화면</button></div></section><section class="card stage"><p class="eyebrow">GAME STATUS</p><div id="status" class="drawn-card">대기</div><p id="progress" class="muted"></p><div class="control-actions"><button id="start">게임 시작</button><button id="end" class="danger">게임 종료</button><button id="delete" class="danger">방 삭제</button></div><p id="startNote" class="small muted"></p></section></div>
<section class="card"><div class="top"><h2 id="playerTitle">학생 현황</h2></div><div class="table-scroll"><table><thead id="tableHead"></thead><tbody id="playerRows"></tbody></table></div></section>
<section id="recordCard" class="card hidden"><h2>라운드 기록</h2><div class="table-scroll"><table><thead><tr><th>라운드</th><th>닉네임</th><th>숫자</th><th>결과</th></tr></thead><tbody id="guessRows"></tbody></table></div></section></section>
<footer>수학 게임 교실 ver1.03 · made by yoonsungho</footer></main>
<script src="../vendor/supabase-2.117.2.js"></script><script src="../vendor/qrcode-1.0.0.min.js"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script type="module" src="../js/competition-teacher.js"></script></body></html>
